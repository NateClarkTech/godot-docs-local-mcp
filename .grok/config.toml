# Project-scoped MCP servers for godot-docs-mcp.
# Loaded automatically by Grok Build when the current working directory
# is inside this repository (or any subdirectory).
#
# Priority: ~/.grok/config.toml < <repo-root>/.grok/config.toml < <cwd>/.grok/config.toml
#
# This is the recommended local on-demand stdio configuration.
# It matches the style used in a typical personal global ~/.grok/config.toml
# (see below and .env.example for how to set GODOT_DOCS_MCP_PATH).

[mcp_servers.godot-docs]
# Local on-demand stdio (recommended). Uses npx so it works cleanly from
# global configs too. Set GODOT_DOCS_MCP_PATH in your environment (or use
# the fallback) so this works whether loaded as project-scoped or global.
command = "npx"
args = ["tsx", "src/stdio.ts"]
cwd = "${GODOT_DOCS_MCP_PATH:</path/to/your/clone/godot-docs-mcp>}"
enabled = true

# For your personal global ~/.grok/config.toml, copy the block above
# and set the env var in your shell profile (or via .env + direnv):
#   export GODOT_DOCS_MCP_PATH="/absolute/path/to/your/clone/godot-docs-mcp"
#
# Then use (with fallback if the var isn't set):
# [mcp_servers.godot-docs]
# command = "npx"
# args = ["tsx", "src/stdio.ts"]
# cwd = "${GODOT_DOCS_MCP_PATH:-/path/to/your/clone/godot-docs-mcp}"
# enabled = true
#
# The project's .grok/config.toml uses ${...:-.} so it works with cwd already
# set by Grok when inside the repo.

# To also have fully offline docs (no network for page content), run once:
#   npm run download-docs latest
#
# See README.md for setup instructions for Grok, Claude, Cursor, and other clients.

# Alternative: the public hosted instance (may be rate-limited or return
# errors like 500 on handshake for some clients/transports).
# [mcp_servers.godot-docs-hosted]
# url = "https://godot-docs-mcp.j2d.workers.dev/mcp"
# enabled = true
